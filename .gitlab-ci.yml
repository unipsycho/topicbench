stages:
  - build

mqtt-monitor-linux:
  stage: build
  image: rust:1.88-bookworm
  before_script:
    - apt-get update -qq
    - |
      apt-get install -y -qq \
        pkg-config libclang-dev cmake \
        libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon0 \
        libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
        libxcb-xkb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
        libxcb-render-util0
  script:
    - rustc --version
    - cargo build --release
    - mkdir -p dist
    - cp target/release/mqtt-monitor dist/
  artifacts:
    name: mqtt-monitor-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/mqtt-monitor
    expire_in: 7 days
