# nfpm config — .rpm / .deb from a staged Linux binary.
# Used by scripts/build-rpm.sh and scripts/build-deb.sh.
# Binary path is injected via env (VERSION, ARCH, BIN).
#
#   nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#   nfpm package -f packaging/nfpm.yaml -p rpm -t dist/

name: topicbench
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
# Discover / PackageKit author line — company name + existing support email.
maintainer: "Agile Automation <mike@agileautomation.ca>"
description: |
  TopicBench — multi-broker MQTT explorer and monitor.
vendor: Agile Automation
homepage: https://github.com/unipsycho/topicbench
# Matches Cargo.toml / LICENSE-MIT + LICENSE-APACHE (SPDX).
license: MIT OR Apache-2.0
contents:
  # expand: true — nfpm only substitutes ${BIN} when requested (v2.43+).
  - src: ${BIN}
    dst: /usr/bin/topicbench
    expand: true
    file_info:
      mode: 0755
  - src: packaging/topicbench.desktop
    dst: /usr/share/applications/topicbench.desktop
  # AppStream — KDE Discover shows developer + license from metainfo.
  - src: packaging/ca.agileautomation.TopicBench.metainfo.xml
    dst: /usr/share/metainfo/ca.agileautomation.TopicBench.metainfo.xml
  # Debian copyright (DEP-5) + full license texts for /usr/share/doc.
  - src: packaging/debian/copyright
    dst: /usr/share/doc/topicbench/copyright
  - src: LICENSE-MIT
    dst: /usr/share/doc/topicbench/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/doc/topicbench/LICENSE-APACHE
  # hicolor PNGs regenerated from assets/icons/app.ico (see scripts/regen-app-icons.sh)
  - src: packaging/icons/topicbench-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/topicbench.png
  - src: packaging/icons/topicbench-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/topicbench.png
  - src: packaging/icons/topicbench-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/topicbench.png
  - src: packaging/icons/topicbench-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/topicbench.png
  - src: packaging/icons/topicbench-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/topicbench.png
  - src: packaging/icons/topicbench-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/topicbench.png
  - src: packaging/icons/topicbench-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/topicbench.png
  - src: packaging/icons/topicbench-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/topicbench.png
  - src: packaging/topicbench.png
    dst: /usr/share/pixmaps/topicbench.png
overrides:
  rpm:
    depends:
      - libxcb
      - libxkbcommon
  deb:
    depends:
      - libxcb1
      - libxkbcommon0
